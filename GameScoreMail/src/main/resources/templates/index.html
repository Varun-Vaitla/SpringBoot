<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guess the number</title>
</head>
<body>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #d4fc79, #96e6a1); /* light green gradient */
    text-align: center;
    padding: 50px;
    margin: 0;
    color: #333;
  }

  h1 {
    color: #2c3e50;
    margin-bottom: 20px;
  }

  p {
    font-size: 18px;
    margin-bottom: 20px;
  }

  form {
    background-color: #ffffff;
    display: inline-block;
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
  }

  input[type="number"] {
    padding: 10px;
    font-size: 16px;
    width: 180px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-right: 10px;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #27ae60;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background-color: #219150;
  }
</style>

<h1>Number Guessing Game</h1>
	<p th:text="${message}"></p>
	<form action="/guess" method="post">
		<input type="number" name="guess" required min="1" max="100" />
		<button type="submit">Submit Guess</button>
	</form>

</body>
</html>
